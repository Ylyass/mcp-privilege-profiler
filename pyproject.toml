[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-privilege-profiler"
version = "0.0.0"
description = "Task-scoped MCP least-privilege profiler with reviewed policies and Wazuh detections."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Apache-2.0" }
authors = [
  { name = "MCP Privilege Profiler contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "aiosqlite>=0.22.1,<0.23",
  "anyio>=4.14.2,<5",
  "jsonschema>=4.26.0,<5",
  "mcp>=1.28.1,<2",
  "pydantic>=2.13.4,<3",
  "rfc8785>=0.1.4,<0.2",
  "typer>=0.26.8,<0.27",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.156.6,<7",
  "pre-commit>=4.6.0,<5",
  "pyright>=1.1.411,<2",
  "pytest>=9.1.1,<10",
  "ruff>=0.15.21,<0.16",
]

[project.scripts]
mcp-privprof = "mcp_privprof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_privprof"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "lab", "tests", "wazuh", "benchmarks", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
reportMissingTypeStubs = false
