version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      development-tool-updates:
        patterns:
          - hypothesis
          - pre-commit
          - pyright
          - pytest
          - ruff
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
