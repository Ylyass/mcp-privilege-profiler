name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.31"

jobs:
  quality:
    name: Quality and security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13.14"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify the lockfile
        run: uv lock --check

      - name: Install the locked development environment
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen pyright

      - name: Check installed dependency compatibility
        run: uv pip check

      - name: Validate the Wazuh detection pack
        run: uv run --frozen python -m wazuh.verify

      - name: Run the deterministic security benchmark
        run: >-
          uv run --frozen python -m benchmarks.runner
          --json-output "${{ runner.temp }}/benchmark.json"
          --markdown-output "${{ runner.temp }}/benchmark.md"

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.13.14"
          - "3.14.6"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked development environment
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run --frozen python scripts/run_pytest.py

  build:
    name: Build and smoke test distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13.14"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with dist/*.whl mcp-privprof version

      - name: Smoke test the source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz mcp-privprof version
